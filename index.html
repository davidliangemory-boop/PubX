<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>企业出海情报台 · PubX</title>



<script>
// Single cache fingerprint for initial assets and every lazy-loaded asset.
window.PUBX_BUILD = '20261029g1';
window.pubxAsset = function (name) { return './assets/' + name + '?v=' + window.PUBX_BUILD; };
['style.css','page_us.css','page_ex.css'].forEach(function (name) {
  document.write('<link rel="stylesheet" href="' + window.pubxAsset(name) + '">');
});
</script>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#/">
      <span class="brand-t">出海情报台</span>
      <span class="brand-s">OUTBOUND INTELLIGENCE · PubX</span>
    </a>
    <div class="gsearch" id="gsearch">
      <span class="gs-ico">⌕</span>
      <input id="gsq" type="text" autocomplete="off" placeholder="搜索公司 / 项目 / 公告 / 证据，或直接提问…"/>
      <span class="gs-kbd">/</span>
    </div>
    <div class="topbar-r">
      <button class="densbtn" id="dens" title="切换信息密度">紧凑</button>
      <button class="burger" id="burger" aria-label="菜单">☰</button>
    </div>
  </div>
  <div class="wrap mainnav-row">
    <nav class="mainnav" id="mainnav">
      <a href="#/research?v=events" data-r="cn">出海信披归纳</a>
      <a href="#/us?v=events" data-r="us">美股·SEC</a>
      <a href="#/hk-market?v=events" data-r="hk">港股·HKEX</a>
      <a href="#/export" data-r="export">出口管制</a>
    </nav>
    <span class="synctime" id="sideSync">—</span>
  </div>
  <nav class="subnav wrap" id="subnav"></nav>
</header>

<div class="searchov" id="searchov">
  <div class="so-panel">
    <div class="so-in"><span class="gs-ico">⌕</span><input id="soq" type="text" autocomplete="off" placeholder="公司 / 代码 / 国家 / 公告关键词 / 问题…"/></div>
    <div class="so-res" id="sores"></div>
  </div>
</div>

<main class="wrap view" id="view"></main>

<footer class="foot wrap">
  <span>数据来自巨潮资讯、HKEX 披露易、SEC EDGAR、发行人官网 IR、OFAC SDN 等公开来源；金额保留原文币种口径</span>
  <span id="footBuild" style="margin-left:12px;color:var(--ink-3)"></span>
  <span id="footSync"></span>
</footer>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer"></aside>

<script>
['data.js','page_us.js','hk_data.js','page_hk.js','export_data.js','page_ex.js','events_index.js','page_ia.js','page_events.js','app.js'].forEach(function (name) {
  document.write('<script src="' + window.pubxAsset(name) + '"><\/script>');
});
</script>
</body>
</html>
