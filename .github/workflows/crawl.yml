name: crawl-and-publish

on:
  schedule:
    # UTC 0/2/4/6/8/10/12/14 点 = 北京时间 08/10/12/14/16/18/20/22 点
    - cron: "0 0-14/2 * * *"
  workflow_dispatch: {}
  repository_dispatch: {}   # 备用：外部自动化推送数据时触发（见README混合模式）

permissions:
  contents: write   # 回写 state/db.json
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装PDF解析回退依赖
        run: pip install pypdf

      - name: 抓取与分析管线
        id: run
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODEL_NAME: kimi-k2-0905-preview
        run: |
          rc=0
          python3 scripts/run_once.py || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "1" ]; then exit 1; fi

      - name: 提交数据更新
        if: steps.run.outputs.rc == '0'
        run: |
          git config user.name "cninfo-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/db.json assets/data.js
          git commit -m "数据更新 $(date '+%Y-%m-%d %H:%M %Z') [skip ci]" && git push || echo "无变更"

      - name: 组装发布目录
        if: steps.run.outputs.rc == '0'
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/
          cp -r assets site/assets

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.rc == '0'
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        if: steps.run.outputs.rc == '0'
        uses: actions/deploy-pages@v4
